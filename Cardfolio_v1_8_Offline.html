/* Visual dashboard: self-contained, responsive charts. Each points bar is normalized
   within its own loyalty program; absolute points across programs are never summed. */
.dashboard-tabs{display:inline-flex;align-items:center;gap:3px;padding:4px;border-radius:12px;background:#edf0f8;margin:0 0 20px}
.dashboard-tabs button{border:0;border-radius:9px;padding:10px 18px;font-size:12px;font-weight:750;color:#6e7b90;background:transparent}
.dashboard-tabs button.is-active{background:#fff;color:var(--blue);box-shadow:0 2px 9px #18233712}
.viz-headline{padding:22px 25px;border-radius:16px;border:1px solid #dce6ff;background:linear-gradient(108deg,#f2f5ff 0%,#eff8fb 100%);margin-bottom:17px}
.viz-headline h2{font-size:19px;margin:0 0 8px;letter-spacing:-.35px}
.viz-headline p{margin:0;color:#65738f;font-size:12px;line-height:1.75}
.viz-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.viz-controls select{min-width:155px}
.viz-controls .viz-control-spacer{flex:1}
.viz-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 17px}
.viz-kpi{padding:19px 20px}
.viz-kpi .viz-kpi-label{font-size:11px;font-weight:730;color:#79869a}
.viz-kpi .viz-kpi-number{font-size:26px;line-height:1.3;font-weight:800;letter-spacing:-.7px;margin:9px 0 4px;font-variant-numeric:tabular-nums}
.viz-kpi .viz-kpi-note{font-size:11px;color:#8b96a8}
.viz-panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(285px,1fr);gap:16px;align-items:start}
.viz-panel{padding:21px;min-width:0}
.viz-panel h2{font-size:16px;margin:0}
.viz-panel .viz-intro{font-size:11.5px;line-height:1.65;color:#8290a4;margin:8px 0 18px}
.viz-legend{display:flex;flex-wrap:wrap;align-items:center;gap:15px;color:#748196;font-size:11px;margin:11px 0 20px}
.viz-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.viz-program-item{border:1px solid #e9edf4;border-radius:12px;padding:14px 15px;margin-bottom:10px;transition:border-color .16s,background-color .16s;background:#fff}
.viz-program-item.is-selected{border-color:#9dacf4;background:#f8faff}
.viz-program-item:hover{border-color:#c3ccef}
.viz-program-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.viz-program-title{font-weight:780;font-size:13px;color:#2a3955;overflow-wrap:anywhere}
.viz-program-pct{font-weight:800;color:var(--blue);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.viz-progress{display:flex;width:100%;height:13px;border-radius:20px;background:#edf0f5;margin:12px 0 10px;overflow:hidden}
.viz-progress .viz-posted{background:#40a98c;transition:width .2s}
.viz-progress .viz-pending{background:#718af0;transition:width .2s}
.viz-program-figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.viz-program-figures div{min-width:0;font-size:10.3px;color:#8994a7}

.viz-program-figures div:first-child strong{color:#178063}
.viz-program-figures div:nth-child(2) strong{color:#4665cf}
.viz-program-action{border:0;background:transparent;color:#536dd0;padding:6px 0 0;font-size:11px;font-weight:700}

.viz-donut-center{width:117px;height:117px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff;box-shadow:0 1px 10px #1d2b5111}

.viz-detail-title{font-size:13px;font-weight:720;color:#2f4261}
.viz-muted{text-align:center;padding:30px 16px;color:#8591a5;font-size:12.5px}
.viz-explain{font-size:11.5px;line-height:1.8;color:#8793a6;margin:15px 2px 0}

/* Cardfolio v1.7.4 | 2026-11-08
 * Baseline: v1.7.2 Input Fix. The reverted Choice-always-visible change is excluded.
 * Offline single HTML; data schema version 6 and cardfolio_data_v6 remain compatible.
 * P0: escaped text output, validated candidate commits, protected damaged storage,
 *     bounded recovery snapshots and safe import rejection.
 * P1: partial credits/explicit zero, product history corrections, tab conflicts,
 *     lazy views, 50-record pages, disposable indexes and formula-text CSV output.
 * Optional fields preserve legacy semantics: creditActualProvided, _productState,
 *     _cardfolioMeta. Unmarked historical credit zero keeps its former fallback.
 * Source boundaries below permit recovering the six development files.
 * Validation: 25 automated regression scenarios, synthetic 50/200/1000/5000 event
 *     benchmarks, offline file URL, desktop and 390px layout. Chrome 155.
 * Native OS IME and arbitrary real-world historical backups were not fully tested.
 * No bank connection or business-data cloud sync is introduced.
 */

// === Cardfolio source: catalog.js ===
const KEY='cardfolio_data_v6';
const LEGACY_KEY='cardfolio_data_v5'; // v1.5 remains untouched as a safety backup.

// Keep the live search input mounted while its results update. Recreating the input

function renderSearchResults(rootSelector,searchId,toolbarHTML,resultsHTML){
 const root=$(rootSelector);if(!root)return;
 let results=root.querySelector('[data-search-results]');
 const existing=root.querySelector('#'+searchId),toolbar=existing?.closest('.toolbar');
 if(!results||!toolbar){root.innerHTML=toolbarHTML+'<div data-search-results></div>';results=root.querySelector('[data-search-results]')}
 else if(document.activeElement!==existing){existing.value=searchId==='card-search'?cardSearch:ledgerSearch;
  const desired=document.createElement('div');desired.innerHTML=toolbarHTML;
  for(const select of toolbar.querySelectorAll('select')){const replacement=desired.querySelector('#'+select.id);if(replacement){select.innerHTML=replacement.innerHTML;select.value=replacement.value}}
 }
 results.innerHTML=resultsHTML;
}

ength?noData('还没有符合条件的信用卡','open-card','添加第一张信用卡 →'):''}`;renderSearchResults('#cards','card-search',html,results+(ownerFilter!=='all'&&ownerFilter!=='unassigned'?memberAUSection(ownerFilter):''))}

function wrapModal(title,body,foot=''){modalDirty=false;if(!document.activeElement?.closest('#modal-root'))runtime.modalFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" title="关闭">×</button></div><div class="modal-body">${body}${foot}</div></div></div>`;requestAnimationFrame(()=>{($('#modal-root form')?.querySelector('input:not([type=hidden]),select,textarea')||$('#modal-root .close'))?.focus()})}
function field(name,label,value='',type='text',extra=''){return `<label class="form-field"><span>${esc(label)}</span><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${type==='number'?'inputmode="decimal"':''} ${extra}></label>`}
function select(name,label,values,current){return `<label class="form-field"><span>${esc(label)}</span><select name="${esc(name)}">${opts(values,current)}</select></label>`}
function textarea(name,label,value){return `<label class="form-field full"><span>${esc(label)}</span><textarea name="${esc(name)}">${esc(value||'')}</textarea></label>`}
function modalFooter(id,kind){return `<div class="modal-actions"><div>${id?`<button type="button" class="btn danger small" data-action="delete-${kind}" data-id="${esc(id)}">删除此记录</button>`:''}</div><div class="right"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">保存</button></div></div>`}
function openCard(id=''){

 let form=`<form id="card-form" data-id="${esc(id)}"><div class="banner">先选择发卡行，再选择该银行的卡产品。目录涵盖常见个人卡、商业卡和部分历史卡；你已录入的自定义银行和产品也会自动进入下拉菜单。未列出的卡可选「其他 / 手动输入」。<strong>目录不是实时开放申请名单。</strong><br>卡号只记录后 5 位；如果两张卡的尾号相同，系统会在各处补充开卡日期来区分。无需输入完整卡号。<br><strong>找不到产品？</strong>选择发卡行后可搜索 Product，或者直接在「原始卡 Product」输入框填写；Amex / BofA 等银行简称会自动合并到正式发卡行名称，不会出现重复选项。<br><strong>日期已精简：</strong>仅填写开卡日期；旧卡若此前没填开卡日期，系统会使用原申请日期自动补齐。</div><div class="form-grid">${select('owner','主卡持有人',memberOptions(true),c.owner||(id?'unassigned':(memberById(ownerFilter)?ownerFilter:data.members[0]?.id||'unassigned')))}${select('issuerChoice','发卡行 / Issuer', [['','请选择发卡行'],...issuerList().map(x=>[x,x]),[OTHER_OPTION,'＋ 其他发卡行 / 手动输入']],issuerChoice)}${field('issuerCustom','自定义发卡行名称',issuerChoice===OTHER_OPTION?c.issuer:'','text','maxlength="120" placeholder="输入银行名称"')}${field('productSearch','搜索卡 Product（按名称过滤下拉菜单）','','search','placeholder="例如 Sapphire、Ink、Platinum、Hilton" autocomplete="off"')}${select('nameChoice','最初申请的卡 Product（下拉选择）',productList,originalChoice)}<div class="form-field full" style="font-size:11px;color:#718095;margin-top:-10px" id="product-search-count" aria-live="polite"></div>${field('nameCustom','或者直接输入原始卡 Product（目录没有也能保存）',originalChoice===OTHER_OPTION?c.name:'','text','maxlength="160" placeholder="找不到卡名？在这里直接输入，优先于下拉选择"')}${select('currentProductChoice','当前卡 Product（升降级后）',currentChoices,currentChoice)}${field('currentProductCustom','或者直接输入当前卡 Product（选填）',currentChoice===OTHER_OPTION?c.currentProduct:'','text','maxlength="160" placeholder="升降级后产品不在下拉菜单时，直接在这里填写"')}${select('programId','默认积分项目（新增奖励自动带入，可覆盖）',programOptions(),c.programId||'')}${select('status','持卡状态',[['active','持有中'],['closed','已关卡']],c.status||'active')}${field('lastFive','卡号后 5 位（选填，仅存这 5 位）',c.lastFive||'','text','inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="off" placeholder="例如 01234；只能输入 5 位数字"')}${field('opened','开卡日期',c.opened,'date')}${field('closed','关卡日期',c.closed,'date')}${field('annualFee','当前预计年费（USD）',c.annualFee||0,'number','min="0" step="0.01"')}${field('nextFeeDate','下一次预计年费日（可不填）',c.nextFeeDate,'date')}${textarea('notes','备注',c.notes)}</div>${modalFooter(id,'card')}</form>`;

}

function openBenefit(id='',presetCard=''){const b=data.benefits.find(x=>x.id===id)||{};if(!data.cards.length){alert('请先添加一张信用卡。');openCard();return}let form=`<form id="benefit-form" data-id="${esc(id)}"><div class="form-grid">${select('cardId','所属信用卡',data.cards.map(c=>[c.id,`${ownerLabel(ownerOf(c))} · ${shortCard(c)}`]),b.cardId||presetCard||data.cards[0].id)}${field('name','报销权益名称',b.name,'text','required placeholder="如 Airline incidental"')}${field('limit','本周期总额度（USD）',b.limit||0,'number','min="0" step="0.01" required')}${field('period','周期名称',b.period||`${YEAR} 年`,'text')}${field('startDate','周期开始',b.startDate||`${YEAR}-01-01`,'date')}${field('endDate','到期日期',b.endDate||`${YEAR}-12-31`,'date')}${textarea('notes','使用规则 / 备注',b.notes)}</div>${modalFooter(id,'benefit')}</form>`;wrapModal(id?'编辑报销额度':'新增报销额度',form)}
function openLedger(id='',presetCard='',presetBenefit='',presetType=''){if(!data.cards.length){alert('请先添加一张信用卡。');openCard();return}let e=data.events.find(x=>x.id===id)||{};let et=e.type||presetType||'signup_bonus';let initialStatus=e.status||(et==='fee'||et==='fee_refund'||et==='close'?'posted':et==='credit'?'pending':'planned');let form=`<form id="ledger-form" data-id="${esc(id)}"><div class="form-grid">${select('cardId','所属信用卡',data.cards.map(c=>[c.id,`${ownerLabel(ownerOf(c))} · ${shortCard(c)}`]),e.cardId||presetCard||data.cards[0].id)}${select('type','记录类型',TYPES,et)}${field('title','事件名称 / Bonus 名称',e.title,'text','placeholder="如 90k welcome offer"')}${select('status','状态',STATUS,initialStatus)}${field('date','登记日期',e.date||TODAY(),'date','required')}${field('postedDate','实际入账日期 / 产品变动日期',e.postedDate,'date')}<div class="form-field full" style="font-weight:400;font-size:11px;line-height:1.7;color:#63728c;margin-top:-7px">登记日期只记录你何时填写此条目，不用于时间线。实际入账日期用于奖励、报销和费用；升降级无论有无 Bonus，都在第二个日期填写产品实际变动日。时间线按第二个日期排序，未填时列入「日期待补充」。</div><div class="subhead">记录详情（随记录类型切换）</div><div id="ledger-fields" class="form-grid" style="grid-column:1/-1"></div>${textarea('memo','备注（可写 offer 条款等）',e.memo)}</div>${modalFooter(id,'ledger')}</form>`;wrapModal(id?'编辑流水记录':'新增流水记录',form);renderLedgerFields(et,e,presetBenefit);$('#ledger-form [name="type"]').addEventListener('change', ev=>{const inputs=$('#ledger-fields');const previous={...e};inputs.querySelectorAll('input,select').forEach(x=>previous[x.name]=x.value);if(previous.newProductChoice)previous.newProduct=previous.newProductChoice===OTHER_OPTION?previous.newProductCustom:previous.newProductChoice;if(!id)$('#ledger-form [name="status"]').value=['fee','fee_refund','close'].includes(ev.target.value)?'posted':ev.target.value==='credit'?'pending':'planned';renderLedgerFields(ev.target.value,previous,$('#ledger-fields [name="benefitId"]')?.value||presetBenefit)})}

 }else if(type==='authorized_user_bonus'){
 body=`<div class="au-checks"><strong>关联已登记的副卡持有关系</strong><div class="pill-note">在「副卡与 Bonus」页面登记后关联；奖励归主卡名下的积分项目。</div>${data.authorizedUsers.filter(a=>a.cardId===($('#ledger-form [name="cardId"]')?.value||e.cardId)).map(a=>`<label><input type="checkbox" name="auRecordIds" value="${esc(a.id)}" ${(e.auRecordIds||[]).includes(a.id)?'checked':''}>${esc(ownerLabel(a.memberId))} · ${a.status==='closed'?'已移除':'持有中'}</label>`).join('')||'<span class="muted tiny">本主卡还没有副卡关系，保存后可稍后关联。</span>'}</div>${field('auHolders','其他 / 旧版副卡昵称（可选）',e.auHolders,'text','placeholder="旧版昵称保留，不用于成员关联"')}${field('auCount','本次符合 Offer 范围的副卡数量',auCount(e),'number','min="1" step="1" required')}${field('auQualifiedCount','其中已达标副卡数',auQualified(e),'number','min="0" step="1"')}${programControl}${number('offerPoints','每张副卡承诺积分 / 里程',e.offerPoints)}${number('actualPoints','累计实际已到账积分【总数，不乘副卡数量】',e.actualPoints)}${number('offerCash','每张副卡承诺现金奖励（USD）',e.offerCash)}${number('actualCash','累计实际到账现金【总数】（USD）',e.actualCash)}${number('spendRequirement','每张副卡消费门槛（USD）',e.spendRequirement)}${field('deadline','奖励达标截止日期',e.deadline,'date')}<div class="highlight" id="au-preview" role="status" aria-live="polite" style="grid-column:1/-1"></div><p class="footnote" style="grid-column:1/-1;margin:0">例如 3 张副卡 × 每张 5,000 UR：承诺 15,000 UR；实际累计到账 10,000 UR 时，状态选「部分到账」，待兑现 5,000 UR。不同积分项目不能混写在同一笔奖励。</p>`;
 }else if(type==='fee'||type==='fee_refund'){
 body=`${number('amount',type==='fee'?'实际收取年费（USD）':'实际退回年费（USD）',e.amount)}<p class="footnote" style="grid-column:1/-1;margin:0">只有「已到账」的记录计入美元收支；年费退回与年费分开记账。</p>`;
 }else if(type==='credit'){
 const options=[['','不关联额度'],...data.benefits.filter(b=>b.cardId===($('#ledger-form [name="cardId"]')?.value||e.cardId)).map(b=>[b.id,`${b.name} (${b.period||''})`])];
 body=`${select('benefitId','关联报销额度',options,e.benefitId||presetBenefit)}${number('claimAmount','申请 / 预计报销金额（USD）',e.claimAmount)}${field('actualAmount','实际到账金额（USD；留空按申请额）',e.creditActualProvided===false?'':e.actualAmount??'','number','min="0" step="any"')}<p class="footnote" style="grid-column:1/-1;margin:0">已到账和部分到账按实际金额计入现金；部分到账的余款计入待入账。实际金额留空时按申请额统计，明确输入 0 则计为 0。旧版的零值原先含义不明确，未重新填写时保持原统计方式。</p>`;
 }else if(type==='close')body='<div class="banner" style="grid-column:1/-1">纯历史事件；请同时把主卡状态改为「已关卡」以停止年费提醒。</div>';
   $('#ledger-fields').innerHTML=body;const form=$('#ledger-form');if(form)form.dataset.autoLedgerProgramId=e.programId?'':selectedProgram;
 if(type==='authorized_user_bonus')updateAUPreview();
 if(type==='upgrade'||type==='downgrade')updateLedgerProductVisibility();
}
function value(form,name){return (form.elements.namedItem(name)?.value||'').trim()}
function ledgerCardChanged(){
 const form=$('#ledger-form');if(!form)return;
 const card=cardById(value(form,'cardId')),program=form.elements.namedItem('programId'),wasAutomatic=!!program&&program.value===(form.dataset.autoLedgerProgramId||'');
 if(wasAutomatic){program.value=card?.programId||'';form.dataset.autoLedgerProgramId=program.value}
 const type=value(form,'type');
 if(type==='authorized_user_bonus'){
  const previous=Object.fromEntries(Array.from($('#ledger-fields').querySelectorAll('input,select')).filter(el=>el.name!=='auRecordIds').map(el=>[el.name,el.value]));
  renderLedgerFields(type,{...previous,auRecordIds:[]});
  if(wasAutomatic)form.dataset.autoLedgerProgramId=form.elements.namedItem('programId')?.value||'';
 }else{
  const benefit=form.elements.namedItem('benefitId');if(benefit)benefit.innerHTML=opts([['','不关联额度'],...data.benefits.filter(b=>b.cardId===card?.id).map(b=>[b.id,b.name])],'');
  refreshLedgerChangeProducts();
 }
}
function getNum(form,name){return Math.max(0,num(value(form,name)))}

function updateAUPreview(){
 const form=$('#ledger-form'),el=$('#au-preview');if(!form||!el)return;
 const c=Math.max(1,Math.trunc(getNum(form,'auCount')||1)),q=Math.min(c,Math.trunc(getNum(form,'auQualifiedCount'))),p=getNum(form,'offerPoints'),a=getNum(form,'actualPoints'),cash=getNum(form,'offerCash'),actualCash=getNum(form,'actualCash');
 const program=programName(value(form,'programId')),status=value(form,'status');
 const promised=p*c,posted=(status==='posted'||status==='partial')?a:0,pending=status==='posted'||status==='expired'?0:status==='partial'?Math.max(0,promised-a):promised;
 const cashOffer=cash*c,cashPosted=(status==='posted'||status==='partial')?actualCash:0,cashPending=status==='posted'||status==='expired'?0:status==='partial'?Math.max(0,cashOffer-actualCash):cashOffer;
 el.innerHTML=`<strong>按项目自动计算</strong> · ${c} 张副卡，${q} 张达标<br>承诺 <strong>${fmtPoints(promised)} ${esc(program)}</strong>，已到账 <strong>${fmtPoints(posted)} ${esc(program)}</strong>，待兑现 <strong>${fmtPoints(pending)} ${esc(program)}</strong><br>现金奖励：承诺 ${money(cashOffer)}，到账 ${money(cashPosted)}，待兑现 ${money(cashPending)}`;
}
function saveForm(form){
 if(!form.reportValidity())return Promise.resolve(false);
 return runMutation(()=>{
  const id=form.dataset.id||uid();
  if(form.id==='program-form'){
   const existing=programById(id),name=value(form,'name'),detail=value(form,'detail');
   if(!name)throw Error('请填写积分项目名称');
   if(data.programs.some(p=>p.id!==id&&normalizedKey(p.name)===normalizedKey(name)))throw Error('同名积分项目已存在');
   if(existing)Object.assign(existing,{name,detail});else data.programs.push({id:'custom-'+uid(),name,detail});
  }else if(form.id==='member-form'){
   const existing=memberById(id),name=value(form,'name');if(!name)throw Error('请填写成员名称');
   if(existing)existing.name=name;else data.members.push({id:newMemberCode(),name});
  }else if(form.id==='au-card-form'){
   const existing=auById(id),o={id,cardId:value(form,'cardId'),memberId:value(form,'memberId'),status:value(form,'status'),issuedDate:value(form,'issuedDate'),closedDate:value(form,'closedDate'),notes:value(form,'notes')};
   if(!memberById(o.memberId))throw Error('请选择有效家庭成员');
   if(existing){Object.assign(existing,o);for(const e of data.events)if(e.type==='authorized_user_bonus'&&e.cardId!==o.cardId)e.auRecordIds=(e.auRecordIds||[]).filter(aid=>aid!==id)}else data.authorizedUsers.push(o);
  }else if(form.id==='card-form'){
   const existing=cardById(id),issuer=issuerFromForm(form),name=originalProductFromForm(form),currentProduct=currentProductFromForm(form,name),lastFive=value(form,'lastFive');
   if(!issuer||!name)throw Error('请选择或填写发卡行及卡 Product');
   if(lastFive&&!/^[0-9]{5}$/.test(lastFive))throw Error('后 5 位需为恰好 5 个数字，或留空');
   const o={id,owner:value(form,'owner'),issuer,name,currentProduct,lastFive,status:value(form,'status'),opened:value(form,'opened'),closed:value(form,'closed'),annualFee:getNum(form,'annualFee'),programId:value(form,'programId'),nextFeeDate:value(form,'nextFeeDate'),notes:value(form,'notes')};
   if(existing){if(currentProduct!==(existing.currentProduct||existing.name))o._productState={base:currentProduct,fromDate:TODAY(),eventIds:[]};Object.assign(existing,o)}else data.cards.push(o);
  }else if(form.id==='benefit-form'){
   const existing=data.benefits.find(x=>x.id===id),o={id,cardId:value(form,'cardId'),name:value(form,'name'),limit:getNum(form,'limit'),period:value(form,'period'),startDate:value(form,'startDate'),endDate:value(form,'endDate'),notes:value(form,'notes')};
   if(existing&&existing.cardId!==o.cardId&&data.events.some(e=>e.type==='credit'&&e.benefitId===id))throw Error('此额度已有报销记录，请先解除关联后再更换主卡');
   if(existing)Object.assign(existing,o);else data.benefits.push(o);
  }else if(form.id==='ledger-form'){
   const type=value(form,'type'),existing=data.events.find(x=>x.id===id),oldCard=existing?cardById(existing.cardId):null,card=cardById(value(form,'cardId'));
   if(!card)throw Error('请选择有效主卡');
   if(existing&&['upgrade','downgrade'].includes(existing.type))ensureProductState(oldCard);
   if(['upgrade','downgrade'].includes(type))ensureProductState(card);
   const o={id,cardId:card.id,type,title:value(form,'title'),status:value(form,'status'),date:value(form,'date'),postedDate:value(form,'postedDate'),memo:value(form,'memo'),auRecordIds:[]};
   if(BONUS_TYPES.includes(type)){
    Object.assign(o,{programId:value(form,'programId'),pointType:programName(value(form,'programId')),offerPoints:getNum(form,'offerPoints'),actualPoints:getNum(form,'actualPoints'),offerCash:getNum(form,'offerCash'),actualCash:getNum(form,'actualCash'),spendRequirement:getNum(form,'spendRequirement'),spendProgress:getNum(form,'spendProgress'),deadline:value(form,'deadline'),newProduct:getNewProduct(form)});
    if((o.offerPoints||o.actualPoints)&&!o.programId)throw Error('有积分奖励时请选择所属常旅客项目');
    if(type==='authorized_user_bonus'){
     Object.assign(o,{auHolders:value(form,'auHolders'),auCount:Math.max(1,Math.trunc(getNum(form,'auCount')||1)),auQualifiedCount:Math.trunc(getNum(form,'auQualifiedCount'))});o.auQualifiedCount=Math.min(o.auQualifiedCount,o.auCount);
     o.auRecordIds=Array.from(form.querySelectorAll('input[name="auRecordIds"]:checked')).map(x=>x.value);
     if(o.auRecordIds.length>o.auCount)throw Error('关联副卡数量超过奖励数量');
    }
   }else if(type==='fee'||type==='fee_refund')o.amount=getNum(form,'amount');
   else if(type==='credit'){
    const explicit=value(form,'actualAmount')!=='';
    Object.assign(o,{benefitId:value(form,'benefitId'),claimAmount:getNum(form,'claimAmount'),actualAmount:getNum(form,'actualAmount')});
    // An untouched legacy zero remains ambiguous and retains its historical meaning.
    if(!existing||existing.type!=='credit'||existing.creditActualProvided!==undefined||form.dataset.creditActualTouched==='true'||num(existing.actualAmount)!==0)o.creditActualProvided=explicit;
   }
   if(type!=='credit')o.benefitId='';
   if(existing)Object.assign(existing,o);else data.events.push(o);
   if(['upgrade','downgrade'].includes(type)&&!card._productState.eventIds.includes(id))card._productState.eventIds.push(id);
   if(oldCard)recalculateProduct(oldCard);if(card!==oldCard)recalculateProduct(card);
   if(type==='close'&&o.status==='posted'){card.status='closed';if(o.postedDate)card.closed=o.postedDate}
  }
 });
}

 return `<details class="mobile-event"><summary><div class="event-topline"><div class="event-card-name">${esc(cardName(e.cardId))}<br>${ownerBadge(ownerOf(cardById(e.cardId)))}</div>${tag(e.status)}</div>${typeTag(e.type)}<div class="event-heading">${esc(eventLabel(e))}</div><div class="event-date">实际日期 · ${esc(eventDateLabel(e))}</div><div class="event-amounts"><div><span>${e.type==='fee'?'实际支出':'已到账'}</span><strong class="received">${esc(actual)}</strong></div><div><span>待兑现</span><strong class="pending">${esc(pending)}</strong></div></div><span class="event-expand">展开详情与编辑 ↓</span></summary><div class="event-detail"><div class="divider"></div><div class="muted">登记日期 · ${fmtDate(e.date)}</div><p>${esc(itemNote(e)||'暂无补充说明')}</p><button class="btn" data-action="open-ledger" data-id="${esc(e.id)}">编辑这条记录</button></div></details>`;
}
function mobileLedger(page,ev){return `<div class="mobile-events">${page.items.map(mobileEvent).join('')}</div>${page.controls}${!ev.length?noData('还没有匹配的记录','open-ledger','新增奖励、年费或报销 →'):''}<p class="footnote">每页最多 50 条；搜索与导出覆盖全部记录。各积分项目独立统计。</p>`}
function renderMobileOverview(){
 const v=metrics(filterYear,'',ownerFilter),rows=pointsSummary(filterYear,ownerFilter),rem=reminders();
 const ranks=new Map(data.visualOrder.map((id,i)=>[id,i]));rows.sort((a,b)=>(ranks.get(a.id)??99999)-(ranks.get(b.id)??99999));
 const recent=data.events.filter(e=>visibleCardId(e.cardId)).slice().sort((a,b)=>eventDate(b).localeCompare(eventDate(a))).slice(0,4);
 $('#overview').innerHTML=`<div class="controls"><select class="field-compact" id="year-filter" aria-label="统计年份">${opts(yearOptions(),filterYear)}</select><span class="more" style="align-self:center">${esc(ownerFilter==='all'?'全家合计':ownerLabel(ownerFilter))}</span></div>
 <section class="mobile-hero"><div class="label">现金净收支 · USD</div><div class="value">${money(v.net)}</div><div class="sub">到账现金奖励 + 报销 + 年费退回 − 年费<br>积分单独记录，不折算现金</div></section>
 <div class="mobile-kpis">${metric('当前持卡',String(visibleCards().filter(c=>c.status!=='closed').length),'张主卡','blue')}${metric('积分项目',String(rows.length),'个项目独立统计','blue')}${metric('待兑现现金 / 报销',money(v.pendingCash+v.pendingCredit),'积分待兑现见下方项目卡片','blue')}</div>
 <div class="quick-actions" aria-label="快速登记"><button class="btn" data-action="open-card"><span class="icon-circle">＋</span>新增信用卡</button><button class="btn" data-action="open-ledger" data-type="signup_bonus"><span class="icon-circle">✦</span>登记 Bonus</button><button class="btn" data-action="open-ledger" data-type="fee"><span class="icon-circle">＄</span>登记年费</button><button class="btn" data-action="open-ledger" data-type="credit"><span class="icon-circle">↙</span>登记报销</button></div>
 <section class="outline section"><div class="section-head"><h2>近期提醒</h2><button class="minibtn" data-tab="timeline">查看全部 →</button></div>${rem.length?rem.slice(0,3).map(r=>`<div class="reminder"><div><strong>${esc(r.kind)} · ${esc(r.title)}</strong><small>${esc(r.note)}</small></div><div class="when">${fmtDate(r.date)}</div></div>`).join(''):noData('未来 90 天没有待办提醒')}</section>
 <section><div class="section-head"><h2>你的 Points & Miles</h2><button class="minibtn" data-tab="visuals">全部项目 →</button></div><div class="viz-cards">${rows.slice(0,4).map(r=>{const cat=vizProgramCategory(r.id,r.name);return `<article class="outline viz-card viz-card-${cat}"><div class="viz-card-title">${esc(r.name)}</div><div class="viz-card-main"><div class="viz-card-label">已到账奖励积分</div><div class="viz-card-number">${fmtPoints(r.posted)}</div></div><div class="viz-card-subgrid"><div class="viz-card-stat pending"><div class="label">待兑现</div><div class="value">${fmtPoints(r.pending)}</div></div><div class="viz-card-stat entries"><div class="label">奖励记录</div><div class="value">${r.entries}</div></div></div><button class="btn small" data-action="mobile-viz" data-id="${esc(r.id)}">查看明细 →</button></article>`}).join('')}</div>${!rows.length?noData('登记奖励后，积分项目会显示在这里','open-ledger','登记第一笔奖励'):''}</section>
 <section style="margin-top:24px"><div class="section-head"><h2>最近记录</h2><button class="minibtn" data-tab="ledger">全部流水 →</button></div><div class="mobile-events">${recent.map(mobileEvent).join('')}</div></section><p class="footnote">已到账积分是手动登记的奖励合计，不等于银行实时可用余额。各设备独立保存，请定期导出完整 JSON 备份。</p>`;
}
function renderMore(){
 const links=[['members','♙','家庭成员','管理 P1 / P2 与家庭账户'],['au','♧','副卡与 Bonus','关联副卡，奖励归主卡账户'],['programs','✦','常旅客项目设置','自定义项目与名称'],['benefits','◎','报销权益','额度、周期与到账记录'],['timeline','◷','时间线与提醒','实际日期、年费与截止日'],['data','↧','备份与说明','JSON 导入 / 导出与程序更新']];
 $('#more').innerHTML=`<div class="more-grid">${links.map(([id,icon,label,note])=>`<button class="btn more-link" data-tab="${id}"><span class="icon-circle">${icon}</span><span><strong>${label}</strong><small>${note}</small></span></button>`).join('')}</div><div class="help"><strong>数据只在这台设备</strong><br>电脑、手机、Safari 与主屏幕 App 请分别导入 JSON。相同网址不会自动同步数据。<br>Cardfolio v${APP_VERSION} · ${esc(pwaStatus)}</div>`;
}
function syncMobileNav(){
 const mainTabs=['overview','cards','ledger','visuals'];
 document.querySelectorAll('.mobile-nav [data-tab]').forEach(el=>{const active=el.dataset.tab===(mainTabs.includes(tab)?tab:'more');el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
}
function labelTables(){document.querySelectorAll('.screen.active .table-wrap table').forEach(table=>{const labels=[...table.querySelectorAll('thead th')].map(x=>x.textContent);table.querySelectorAll('tbody tr').forEach(row=>[...row.children].forEach((cell,i)=>{cell.dataset.label=labels[i]||''}))})}
function updateModalState(){const open=!!$('#modal-root .modal');document.body.classList.toggle('modal-open',open);$('.app').inert=open;$('.mobile-nav').inert=open;if(!open)modalDirty=false}
function confirmDiscard(){return !modalDirty||confirm('表单尚未保存。放弃这些输入并关闭吗？')}
function noteBackup(){
 try{localStorage.setItem(BACKUP_TIME_KEY,new Date().toISOString())}catch{}
 refreshBackupMeta();toast('备份已发起，请确认文件已保存到「文件」或其他安全位置。');
}
function backupDate(){try{const date=localStorage.getItem(BACKUP_TIME_KEY);return date&&Number.isFinite(Date.parse(date))?new Date(date).toLocaleString():'尚未导出'}catch{return '无法读取'}}
function refreshBackupMeta(){document.querySelectorAll('[data-backup-time]').forEach(el=>el.textContent=backupDate())}
function backupPanel(){return `<section class="outline section"><div class="section-head"><h2>本机备份与离线应用</h2><span class="tag blue">v${APP_VERSION}</span></div><p class="backup-meta">最近发起 JSON 导出 / 分享：<strong data-backup-time>${esc(backupDate())}</strong><br>这是导出操作时间，无法确认你是否已在系统中保存文件。</p><div class="controls"><button class="btn primary" data-action="export-json">下载完整 JSON</button><button class="btn" data-action="share-json">分享 / 保存备份</button><button class="btn" data-action="import-json">从「文件」导入 JSON</button></div><p class="footnote">导入前会验证并提示覆盖；建议先导出当前数据。JSON 始终由你手动保存与迁移，不会上传到 Cardfolio 服务器。电脑、手机、Safari 与主屏幕 App 的存储应分别检查；首次安装后请导入已有备份。</p><div class="highlight"><strong>本地记录不是永久可靠的云端备份。</strong>清理浏览器数据、系统回收空间、删除 App 或更换设备都可能丢失记录。请将 JSON 保存到你能找到的位置，并定期检查。<br><br>iPhone：Safari 分享菜单 →「添加到主屏幕」→ 打开新 App →「更多 / 备份与说明」→ 从「文件」导入 JSON。</div><p class="backup-meta" id="pwa-detail">${esc(pwaStatus)}</p><div class="controls"><button class="btn small" data-action="check-update">检查程序更新</button><button class="btn small" data-action="apply-update">安装已下载的更新</button></div><p class="footnote">更新只替换程序缓存，不删除 localStorage。部署到不同域名、协议或端口后，请重新手动导入备份。</p></section>`}
async function shareJSON(){
 const file=new File([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],`cardfolio-backup-${TODAY()}.json`,{type:'application/json'});
 if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Cardfolio 完整备份'});noteBackup()}catch(err){if(err.name!=='AbortError')toast('系统分享未完成，请使用「下载完整 JSON」。')}return}
 exportJSON();
}
function showPWA(){
 const el=$('#pwa-detail');if(el)el.textContent=pwaStatus;
 const waiting=pwaRegistration?.waiting;
 $('#pwa-notice').innerHTML=waiting||reloadPending?`<strong>程序更新已就绪</strong> · 本地记录会保留。请先保存表单。<button class="btn small" data-action="apply-update">更新并重新打开</button>`:'';
 if(tab==='more')renderMore();
}
async function checkUpdate(){
 if(!pwaRegistration){toast(location.protocol==='file:'?'独立 HTML 不使用在线更新，请替换程序文件。':'离线应用尚未就绪，请联网后重新打开。');return}
 try{await pwaRegistration.update();toast(pwaRegistration.waiting?'更新已下载，可安装更新。':'已检查更新；有新版本时会显示提示。')}catch{toast('当前无法联网检查，已有离线程序仍可使用。')}showPWA();
}
function applyUpdate(){
 if(runtime.busy||modalDirty){toast('请先保存或关闭未保存的表单，再更新程序。');return}
 if(reloadPending){location.reload();return}
 if(pwaRegistration?.waiting)pwaRegistration.waiting.postMessage({type:'SKIP_WAITING'});else toast('暂无已下载的更新，请先检查更新。');
}
async function initPWA(){
 if(location.protocol==='file:'||!('serviceWorker'in navigator)||!isSecureContext){showPWA();return}
 try{
  pwaStatus='正在准备离线程序…';
  pwaRegistration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  const ready=()=>{pwaStatus=navigator.onLine?'离线程序已就绪 · 记录保存在本机':'当前离线 · 可查看和保存本地记录';showPWA()};
  if(pwaRegistration.active)ready();
  const observeInstall=()=>{const worker=pwaRegistration.installing;if(!worker)return;const changed=()=>{if(worker.state==='installed'){if(navigator.serviceWorker.controller){pwaStatus='新版本已下载，等待你安装';showPWA()}else ready()}if(worker.state==='redundant'){pwaStatus='离线程序缓存未完成，请联网重试';showPWA()}};worker.addEventListener('statechange',changed);changed()};
  pwaRegistration.addEventListener('updatefound',observeInstall);observeInstall();
  navigator.serviceWorker.ready.then(ready);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!navigator.serviceWorker.controller)return;if(runtime.busy||modalDirty){reloadPending=true;pwaStatus='程序已更新；请保存表单后重新打开';showPWA()}else if(pwaRegistration.active&&document.documentElement.dataset.pwaControlled==='true'){location.reload()}else{document.documentElement.dataset.pwaControlled='true';ready()}});
  document.documentElement.dataset.pwaControlled=String(!!navigator.serviceWorker.controller);
  showPWA();
 }catch{pwaStatus='离线程序未能初始化；核心功能可继续使用，请检查 HTTPS 和部署文件';showPWA()}
}
document.addEventListener('input',e=>{if(e.target.closest('#modal-root form'))modalDirty=true},true);
document.addEventListener('change',e=>{if(e.target.closest('#modal-root form'))modalDirty=true},true);
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action;
 if((action.startsWith('open-')||action==='view-card')&&$('#modal-root form')&&modalDirty){if(!confirmDiscard()){e.preventDefault();e.stopImmediatePropagation();return}modalDirty=false}
 if(action==='mobile-viz'){visualSelected=el.dataset.id;visualYear=filterYear;runtime.dirty.add('visuals');setTab('visuals');requestAnimationFrame(()=>$('#visuals .viz-detail')?.scrollIntoView({block:'start'}))}
 else if(action==='share-json')shareJSON();else if(action==='check-update')checkUpdate();else if(action==='apply-update')applyUpdate();
},true);
window.addEventListener('beforeunload',e=>{if(modalDirty||runtime.busy){e.preventDefault();e.returnValue=''}});
new MutationObserver(()=>{updateModalState()}).observe($('#modal-root'),{childList:true});
new MutationObserver(labelTables).observe($('.main'),{childList:true,subtree:true});
compactMedia.addEventListener('change',()=>{runtime.dirty.add('overview');runtime.dirty.add('ledger');renderCurrent();syncMobileNav()});
function updateViewport(){
 const vv=window.visualViewport;
 document.documentElement.style.setProperty('--viewport-height',(vv?.height||innerHeight)+'px');
 document.documentElement.style.setProperty('--viewport-top',(vv?.offsetTop||0)+'px');
 const editing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'');
 document.body.classList.toggle('keyboard-open',editing&&!!vv&&vv.scale<=1.05&&innerHeight-vv.height>130);
}
window.visualViewport?.addEventListener('resize',updateViewport);window.visualViewport?.addEventListener('scroll',updateViewport);window.addEventListener('resize',updateViewport);updateViewport();
document.addEventListener('focusin',updateViewport);document.addEventListener('focusout',()=>requestAnimationFrame(updateViewport));
window.addEventListener('online',()=>{if(pwaRegistration){pwaStatus='已恢复网络 · 检查程序更新';showPWA();pwaRegistration.update().catch(()=>{})}});
window.addEventListener('offline',()=>{pwaStatus=pwaRegistration?'当前离线 · 可查看和保存本地记录':'当前离线 · 请勿清理浏览器本地记录';showPWA()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pwaRegistration&&navigator.onLine)pwaRegistration.update().catch(()=>{})});
initPWA();

invalidate();setTab('overview');

})();
</script>
</body>
